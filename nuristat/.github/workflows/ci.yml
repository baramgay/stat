name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nuristat
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (Qt headless)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libxkbcommon-x11-0 \
            libdbus-1-3 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-cursor0 libfontconfig1 x11-utils xvfb

      - name: Install package + dev/viz/ml extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz,ml]"

      - name: Lint (ruff)
        run: ruff check src/

      - name: Type check (mypy)
        run: mypy src/nuristat/ --ignore-missing-imports

      - name: Run core/analysis/io tests (headless, no Qt widgets)
        env:
          QT_QPA_PLATFORM: offscreen
          DISPLAY: ":99"
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 1
          python -m pytest tests/ \
            --ignore=tests/ui \
            --tb=short -q \
            --timeout=60 \
            --cov=nuristat \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Run UI tests (headless Qt widgets, non-blocking)
        env:
          QT_QPA_PLATFORM: offscreen
          DISPLAY: ":99"
        continue-on-error: true
        run: |
          python -m pytest tests/ui/ \
            --tb=short -q \
            --timeout=30 \
            -x
        timeout-minutes: 5

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./nuristat/coverage.xml
          flags: unittests
          fail_ci_if_error: false

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: nuristat

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build wheel
        run: |
          pip install build
          python -m build

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheel
          path: nuristat/dist/
          retention-days: 7
