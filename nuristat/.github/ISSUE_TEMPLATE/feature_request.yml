name: Feature Request
description: Suggest a new statistical method, analysis option, or workflow improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to NuriStat!

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New analysis method (statistical test, model)
        - Existing analysis — additional options/output
        - Data import / export format
        - Chart / visualization
        - UI / workflow improvement
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or limitation you're hitting.
      placeholder: "Currently, NuriStat doesn't support ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you'd like to see. Reference SPSS/MedCalc behavior if applicable.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you currently use?

  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to papers, SPSS documentation, or other software that implements this feature.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
