[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "statworkbench"
version = "3.3.1"
description = "Menu-based desktop statistical package — SPSS/MedCalc alternative"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Hermes Agent", email = "hermes@statworkbench.local"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PySide6>=6.6,<8",
    "pandas>=2.0,<3",
    "numpy>=1.24,<3",
    "scipy>=1.11,<2",
    "statsmodels>=0.14,<1",
    "openpyxl>=3.1,<4",
    "pydantic>=2.0,<3",
    "chardet>=5.2,<6",
    "pyarrow>=14.0,<20",
    "scikit-learn>=1.3,<2",
    "tabulate>=0.9,<1",
    "pyreadstat>=1.2,<2",
]

[project.optional-dependencies]
stats = [
    "lifelines>=0.27,<0.30",
]
ml = [
    "lifelines>=0.27,<0.30",
]
dev = [
    "pytest>=7.4,<9",
    "pytest-qt>=4.2,<5",
    "pytest-cov>=4.1,<6",
    "mypy>=1.5,<2",
    "ruff>=0.1,<1",
]
viz = [
    "matplotlib>=3.7,<4",
    "seaborn>=0.12,<1",
    "plotly>=5.18,<7",
    "wordcloud>=1.9,<2",
    "python-docx>=1.1,<2",
]

[project.scripts]
statworkbench = "statworkbench.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/statworkbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
qt_api = "pyside6"
pythonpath = ["src"]

[tool.coverage.run]
source = ["statworkbench"]
omit = [
    "src/statworkbench/ui/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "N802",  # function name should be lowercase — Qt override methods use camelCase
    "N803",  # argument name should be lowercase — statistical convention (X, y matrices)
    "N806",  # variable in function should be lowercase — statistical convention (X, y, T, E, Z)
    "E501",  # line too long — enforced separately; many long lines are in UI/string literals
    "E402",  # module import not at top — 모듈 공통 logger 초기화 및 의도적 matplotlib.use("Agg") 순서
]
