[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "statworkbench"
version = "0.1.0"
description = "Menu-based desktop statistical package — SPSS/MedCalc alternative"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Hermes Agent", email = "hermes@statworkbench.local"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PySide6>=6.6",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "chardet>=5.2",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.2",
    "pytest-cov>=4.1",
    "mypy>=1.5",
    "ruff>=0.1",
]
viz = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.18",
]

[project.scripts]
statworkbench = "statworkbench.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/statworkbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
qt_api = "pyside6"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP"]
